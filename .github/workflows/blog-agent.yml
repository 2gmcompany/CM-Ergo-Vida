name: Publicar artigos do formulário

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: Africa/Maputo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-agent
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-blog-agent.txt
      - name: Generate and publish new blog posts
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6.1-terra
        run: python scripts/blog_agent.py
      - name: Save published posts and processing state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog
          if ! git diff --cached --quiet; then
            git commit -m "Publish new Ergovida blog posts"
            git push
          fi
