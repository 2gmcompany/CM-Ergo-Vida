<!doctype html>
<html lang="pt-MZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/styles.css"><title>Blog Ergovida | Informação que também cuida</title></head>
<body><main class="blog-page"><a class="blog-back" href="../">← Voltar ao site</a><span class="blog-eyebrow">Blog Ergovida</span><h1>Informação que também cuida.</h1><p class="blog-intro">Conteúdos da Ergovida para promover saúde e bem-estar.</p><section id="posts" class="blog-posts" aria-live="polite"><p>A carregar artigos…</p></section><a class="cta" href="../#contactos">Falar connosco →</a></main>
<script>fetch('posts.json').then(r=>r.ok?r.json():[]).then(posts=>{const list=document.querySelector('#posts');if(!posts.length){list.innerHTML='<p>Em breve, notícias e conteúdos da Ergovida serão publicados aqui.</p>';return}list.innerHTML=posts.map(p=>`<article class="blog-card">${p.image?`<a href="${p.url}"><img src="${p.image}" alt="" loading="lazy"></a>`:''}<div><time>${new Date(p.date).toLocaleDateString('pt-MZ')}</time><h2><a href="${p.url}">${p.title}</a></h2><p>${p.subtitle}</p><a class="blog-read" href="${p.url}">Ler artigo →</a></div></article>`).join('')}).catch(()=>{document.querySelector('#posts').innerHTML='<p>Não foi possível carregar os artigos.</p>'})</script></body></html>
